{% extends 'checkout.html' %}
{% block scripts %}<script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>const statusText=document.getElementById('payment-status');document.getElementById('pay').addEventListener('click',function(){if(typeof Razorpay==='undefined'){statusText.textContent='Payment could not load. Check your connection and reload this page.';return;}const options=JSON.parse(document.getElementById('payment-options').textContent);options.modal={ondismiss:()=>statusText.textContent='Payment was cancelled. You can try again.'};const payment=new Razorpay(options);payment.on('payment.failed',()=>statusText.textContent='Payment failed. Please try again.');payment.open();});</script>{% endblock %}
